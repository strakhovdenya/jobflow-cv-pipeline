version: 2
updates:
  # Root package.json is minimal (husky + lint-staged dev tooling only) —
  # apps/api and apps/web each have their own package.json (ADR-023) and
  # need their own Dependabot entries to actually be scanned.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The acceptance verifier is pinned to openai/codex-action v1.11 on purpose. v1.12 hangs
      # after Codex has finished (openai/codex-action#150, #169, #172; fix PR #151 unmerged), which
      # kept the verifier running until the ~25 min force-cancel. See ADR-041 (ISSUE-449
      # amendment). Remove this rule only together with moving the pin to a released version that
      # contains the fix; tracked in issue #452.
      - dependency-name: "openai/codex-action"

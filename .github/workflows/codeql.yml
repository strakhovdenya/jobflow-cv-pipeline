name: CodeQL

# PR CodeQL is the final job of the CI workflow so Acceptance Verifier can
# start only after both ordinary CI and CodeQL have succeeded. This standalone
# workflow keeps default-branch and weekly security scanning independent.
on:
  push:
    branches: [main, "task/*-base"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

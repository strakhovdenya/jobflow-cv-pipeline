name: Calibration Judge

# Root-cause analysis of one Acceptance Verifier round (EPIC-31). A round is one attempt of the
# verifier workflow on a PR (run ID + attempt). Judge only observes: it never changes the verdict,
# the `Acceptance Verifier` status or labels, it is not a required check, and its failure cannot
# turn a PR red. Trust boundaries follow ADR-041: Judge prompts, schema templates, taxonomy,
# inputs.json, the allowlist and scripts/calibration-judge* come from the default branch
# (`github.sha`); the PR head is checked out only as data and nothing from it is executed;
# OPENAI_API_KEY reaches only the two model steps. Stage 1 and stage 2 are separate jobs because
# drop-sudo runs once per job (ADR-041, ISSUE-449 amendment); stage 1 sees only the independent
# package.
#
# The verifier itself runs on workflow_run, so its run metadata (head_branch, head_sha) names the
# default branch, never the PR. The PR and its head commit are therefore read from the round's
# own artifacts (`verdict-report`, or `verdict` for rounds before it existed) and checked with
# `calibration-judge.js check-pr`: only a `task/ISSUE-` branch of this repository is analysed.
# Manual run: `workflow_dispatch` with a PR number and, optionally, a verifier run ID and attempt;
# without them the rounds are found through the `Acceptance Verifier` statuses on the PR's
# commits, the latest attempt that is a round is analysed and its ID is written to the summary.

on:
  workflow_run:
    workflows: [Acceptance Verifier]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      run_id:
        description: Acceptance Verifier run ID (default - latest round)
        required: false
        type: string
      run_attempt:
        description: Attempt of that run (default - latest round)
        required: false
        type: string

permissions: {}

env:
  # Same Codex CLI as the verifier (acceptance-verifier.yml); see the pin comment there.
  CODEX_VERSION: 0.156.1

jobs:
  collect:
    name: Collect inputs
    # A verifier run that did not conclude with success or failure (skipped for a non-PR CI run,
    # cancelled) published nothing and is not a round.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      run_id: ${{ steps.round.outputs.run_id }}
      run_attempt: ${{ steps.round.outputs.run_attempt }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      skip: ${{ steps.pr.outputs.skip != 'false' }}
      model_allowed: ${{ steps.model.outputs.allowed }}
    steps:
      - name: Checkout trusted Judge files from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            .github/calibration
            .github/verifier
            scripts/calibration-judge.js
            scripts/calibration-judge/
          persist-credentials: false

      # Picks the round. Every untrusted value reaches the shell only through env. A
      # workflow_run attempt that is not a round (stale: Verify succeeded and Report was
      # skipped) is skipped quietly; a manual run fails with the reason instead.
      - name: Resolve round
        id: round
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          VERIFIER_WORKFLOW: .github/workflows/acceptance-verifier.yml
          VERIFIER_CONTEXT: Acceptance Verifier
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          mkdir -p meta
          RESOLVE_ARGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_PR" =~ ^[0-9]+$ ]]; then echo "::error::pr must be a number"; exit 1; fi
            PR_LABEL="$INPUT_PR"
            if [ -n "$INPUT_RUN_ID" ]; then
              if [[ ! "$INPUT_RUN_ID" =~ ^[0-9]+$ ]]; then echo "::error::run_id must be a number"; exit 1; fi
              RUN_IDS="$INPUT_RUN_ID"
              RESOLVE_ARGS+=(--run-id "$INPUT_RUN_ID")
            else
              # `Report` sets this status on the PR head commit in every round; its target_url
              # is the run. A forged status is harmless: the run must be a verifier run, and
              # check-pr ties the round to the PR below.
              RUN_IDS=$(for SHA in $(gh api --paginate "repos/$REPO/pulls/$INPUT_PR/commits" --jq '.[].sha'); do
                gh api --paginate "repos/$REPO/commits/$SHA/statuses" \
                  | jq -r --arg context "$VERIFIER_CONTEXT" '.[] | select(.context == $context) | .target_url'
              done | { grep -oE '/actions/runs/[0-9]+' || true; } | grep -oE '[0-9]+$' | sort -u || true)
            fi
            if [ -n "$INPUT_RUN_ATTEMPT" ]; then
              if [[ ! "$INPUT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then echo "::error::run_attempt must be a number"; exit 1; fi
              RESOLVE_ARGS+=(--run-attempt "$INPUT_RUN_ATTEMPT")
            fi
          else
            PR_LABEL="?"
            RUN_IDS="$EVENT_RUN_ID"
            RESOLVE_ARGS+=(--run-id "$EVENT_RUN_ID" --run-attempt "$EVENT_RUN_ATTEMPT")
          fi

          : > meta/attempts.jsonl
          for RUN_ID in $RUN_IDS; do
            RUN_JSON=$(gh api "repos/$REPO/actions/runs/$RUN_ID")
            if [ "$(jq -r '.path' <<< "$RUN_JSON")" != "$VERIFIER_WORKFLOW" ]; then
              echo "::warning::Run $RUN_ID is not an Acceptance Verifier run; ignored"
              continue
            fi
            LAST_ATTEMPT=$(jq -r '.run_attempt' <<< "$RUN_JSON")
            for ATTEMPT in $(seq 1 "$LAST_ATTEMPT"); do
              ATTEMPT_JSON=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT" \
                --jq '{run_id: .id, run_attempt, status, conclusion, run_started_at, updated_at}')
              JOBS=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
                --jq '.jobs[] | {name, status, conclusion}' | jq -s '.')
              jq -c -n --argjson a "$ATTEMPT_JSON" --argjson j "$JOBS" '$a + {jobs: $j}' >> meta/attempts.jsonl
            done
          done
          jq -s '.' meta/attempts.jsonl > meta/attempts.json

          if ! ROUND=$(node trusted/scripts/calibration-judge.js resolve-round \
            --attempts meta/attempts.json --inputs trusted/.github/calibration/inputs.json \
            --pr "$PR_LABEL" "${RESOLVE_ARGS[@]}"); then
            if [ "$EVENT_NAME" = "workflow_run" ]; then skip "Verifier attempt is not a round"; fi
            exit 1
          fi
          RUN_ID=$(jq -r '.run_id' <<< "$ROUND")
          RUN_ATTEMPT=$(jq -r '.run_attempt' <<< "$ROUND")
          jq --argjson id "$RUN_ID" --argjson n "$RUN_ATTEMPT" \
            '.[] | select(.run_id == $id and .run_attempt == $n)' meta/attempts.json > meta/attempt.json
          {
            echo "skip=false"
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          echo "Calibration Judge: verifier run $RUN_ID, attempt $RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

      # Artifacts belong to a run, not to an attempt. For each name the newest artifact created
      # before this attempt ended is taken: a rerun of only `Report` keeps the earlier `verdict`,
      # and a later attempt's artifacts are never mixed into this round.
      - name: Download verifier artifacts of the round
        if: steps.round.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.round.outputs.run_id }}
        run: |
          set -euo pipefail
          END=$(jq -r '.updated_at' meta/attempt.json)
          ARTIFACTS=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | {id, name, created_at, expired}' | jq -s '.')
          for NAME in verdict verdict-second verdict-report; do
            ID=$(jq -r --arg name "$NAME" --arg end "$END" \
              'map(select(.name == $name and (.expired | not) and .created_at <= $end))
               | sort_by(.created_at) | last | .id // empty' <<< "$ARTIFACTS")
            if [ -z "$ID" ]; then echo "- artifact $NAME: absent" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            gh api "repos/$REPO/actions/artifacts/$ID/zip" > "meta/$NAME.zip"
            mkdir -p "art/$NAME"
            unzip -q "meta/$NAME.zip" -d "art/$NAME"
            echo "- artifact $NAME: $ID" >> "$GITHUB_STEP_SUMMARY"
          done

      # The round's PR and head commit come from `verdict-report.json`, or for rounds before it
      # existed from the `verdict` artifact's ci.json/provenance.json head commit. check-pr then
      # requires a `task/ISSUE-` branch of this repository and ties the round to the PR (fail
      # closed). workflow_run: a round that is not for such a PR is skipped quietly.
      - name: Identify pull request
        id: pr
        if: steps.round.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          reject() {
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "::notice::$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::$1"; exit 1
          }
          ROUND_PR=""
          ROUND_SHA=""
          if [ -f art/verdict-report/verdict-report.json ]; then
            ROUND_PR=$(jq -r '.pr_number // empty' art/verdict-report/verdict-report.json)
            ROUND_SHA=$(jq -r '.head_sha // empty' art/verdict-report/verdict-report.json)
          fi
          for FILE in art/verdict/ci.json art/verdict/provenance.json; do
            if [ -z "$ROUND_SHA" ] && [ -f "$FILE" ]; then ROUND_SHA=$(jq -r '.head_sha // empty' "$FILE"); fi
          done
          jq -n --arg pr "$ROUND_PR" --arg head "$ROUND_SHA" \
            '{pr_number: (if $pr == "" then null else $pr end), head_sha: (if $head == "" then null else $head end)}' \
            > meta/round.json

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR"
          else
            PR_NUMBER="$ROUND_PR"
            if [ -z "$PR_NUMBER" ] && [ -n "$ROUND_SHA" ]; then
              PR_NUMBER=$(gh api "repos/$REPO/commits/$ROUND_SHA/pulls" \
                | jq -r --arg sha "$ROUND_SHA" '[.[] | select(.head.sha == $sha)][0].number // empty')
            fi
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then reject "Round has no pull request"; fi

          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          SHAS=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[].sha' | jq -R . | jq -s '.')
          jq --argjson shas "$SHAS" \
            '{number, head_ref: .head.ref, head_repo: .head.repo.full_name, commit_shas: $shas}' \
            <<< "$PR_JSON" > meta/pull.json
          if ! REASON=$(node trusted/scripts/calibration-judge.js check-pr --pull meta/pull.json \
            --round meta/round.json --repository "$REPO" --branch-prefix 'task/ISSUE-' 2>&1); then
            reject "$REASON"
          fi
          jq -r '.base.sha' <<< "$PR_JSON" > meta/base-sha.txt
          {
            echo "skip=false"
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$ROUND_SHA"
            echo "branch=$(jq -r '.head.ref' <<< "$PR_JSON")"
          } >> "$GITHUB_OUTPUT"
          echo "Calibration Judge: PR #$PR_NUMBER, head $ROUND_SHA" >> "$GITHUB_STEP_SUMMARY"

      # Builds the raw directory `collect` reads (.github/calibration/inputs.json). When the
      # round has no `verdict-report` comment (rounds before it existed), the current verifier
      # comment is read through the API instead and marked not historical (INV-6).
      - name: Build raw inputs
        id: raw
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p raw/trusted
          if [ -d art/verdict ]; then
            find art/verdict -maxdepth 1 -type f -exec cp {} raw/ \;
            for FILE in issue.md files.txt diff.patch; do
              if [ -f "art/verdict/.verifier/$FILE" ]; then cp "art/verdict/.verifier/$FILE" raw/; fi
            done
          fi
          if [ -d art/verdict-second ]; then find art/verdict-second -maxdepth 1 -type f -exec cp {} raw/ \;; fi
          HISTORICAL_COMMENT=true
          if [ -f art/verdict-report/comment.md ]; then
            cp art/verdict-report/comment.md raw/verifier-comment.md
          else
            HISTORICAL_COMMENT=false
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- acceptance-verifier -->"))) | .body' \
              > meta/verifier-comment.md
            if [ -s meta/verifier-comment.md ]; then cp meta/verifier-comment.md raw/verifier-comment.md; fi
          fi
          echo "historical_comment=$HISTORICAL_COMMENT" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH" =~ ^task/ISSUE-([0-9]+)- ]]; then
            ISSUE_NUMBER="${BASH_REMATCH[1]}"
            gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body \
              --jq '"# " + .title + "\n\n" + .body' > raw/issue-current.md
            gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              --jq '.[] | {id, created_at, body}' | jq -s '.' > raw/pr-comments.json
          fi
          jq --arg repo "$REPO" '{run_id, run_attempt, repository: $repo, conclusion}' meta/attempt.json > raw/run.json
          jq '{jobs}' meta/attempt.json > raw/jobs.json
          # base_sha is the merge base of the round's head with the PR's base branch, not the branch
          # tip when Judge runs: it stays the same for every later Judge run and can be computed
          # the same way for an earlier round (the verifier records no base commit).
          BASE_TIP=$(cat meta/base-sha.txt)
          MERGE_BASE=""
          if [[ "$BASE_TIP" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            MERGE_BASE=$(gh api "repos/$REPO/compare/$BASE_TIP...$HEAD_SHA" --jq '.merge_base_commit.sha' || true)
          fi
          if [[ ! "$MERGE_BASE" =~ ^[0-9a-f]{40}$ ]]; then MERGE_BASE=""; fi
          jq -n --arg head "$HEAD_SHA" --arg base "$MERGE_BASE" \
            '{head_sha: $head, base_sha: (if $base == "" then null else $base end)}' > raw/pr.json

          # The trusted policy as this round saw it: each trusted config at the round's verifier
          # commit, so it compares like for like with the previous round. A config that cannot be
          # read there keeps the default-branch copy, is named in the summary and is left out of
          # the policy diff (meta/pinned-configs.txt lists the pinned ones).
          cp -R trusted/.github raw/trusted/.github
          : > meta/pinned-configs.txt
          VERIFIER_COMMIT=$(jq -r '.verifier_commit // empty' raw/provenance.json 2>/dev/null || true)
          if [[ "$VERIFIER_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            for CONFIG in $(jq -r '.trustedConfigs[]' trusted/.github/calibration/inputs.json); do
              if gh api -H 'Accept: application/vnd.github.raw' \
                "repos/$REPO/contents/$CONFIG?ref=$VERIFIER_COMMIT" > meta/trusted-config; then
                mkdir -p "raw/trusted/$(dirname "$CONFIG")"
                cp meta/trusted-config "raw/trusted/$CONFIG"
                echo "$CONFIG" >> meta/pinned-configs.txt
              else
                echo "- trusted config not readable at the round's verifier commit: $CONFIG" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
          if [ -f art/verdict-report/result.json ]; then cp art/verdict-report/result.json raw/result.json; fi

      # The previous round, for stage 2 only: its analysis comes from the hidden rounds block of
      # Judge's own comment, its manifest from collecting that round's verifier artifacts again,
      # plus the code diff between the two head commits, the issue diff and the trusted-policy
      # diff, and the script results `compare` and `transitions`. These files are full-only inputs
      # (inputs.json); stage 1 never downloads them. A part that cannot be built is left out and
      # becomes an absent input; previous-round.json always states whether an earlier round
      # exists (absent), was read (present) or could not be read (unreadable). `compare` and
      # `transitions` treat the round as the first one only when no earlier round exists; when an
      # earlier round exists but cannot be rebuilt, their results are left out instead.
      - name: Build previous round inputs
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RUN_ID: ${{ steps.round.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.round.outputs.run_attempt }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -uo pipefail
          INPUTS=trusted/.github/calibration/inputs.json
          mkdir -p prev/raw/trusted pkg/context
          if ! gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | {id, user: {login: .user.login}, body}' | jq -s '.' > meta/judge-comments.json; then
            rm -f meta/judge-comments.json
          fi
          node trusted/scripts/calibration-judge.js previous-round --comments meta/judge-comments.json \
            --author 'github-actions[bot]' --repository "$REPO" --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" --out raw/previous-round.json
          PREV_STATUS=$(jq -r '.status' raw/previous-round.json)
          echo "- previous round: $PREV_STATUS" >> "$GITHUB_STEP_SUMMARY"

          PREV_PKG=""
          PREV_TRANSITIONS=""
          if [ "$PREV_STATUS" = "absent" ]; then
            PREV_PKG=none
            PREV_TRANSITIONS=none
          fi
          if [ "$PREV_STATUS" = "present" ]; then
            PREV_RUN=$(jq -r '.round_key.verifier_run_id' raw/previous-round.json)
            PREV_ATTEMPT=$(jq -r '.round_key.verifier_run_attempt' raw/previous-round.json)
            PREV_HEAD=$(jq -r '.head_sha // empty' raw/previous-round.json)
            if [[ "$PREV_RUN" =~ ^[0-9]+$ && "$PREV_ATTEMPT" =~ ^[0-9]+$ ]] \
              && gh api "repos/$REPO/actions/runs/$PREV_RUN/attempts/$PREV_ATTEMPT" > meta/prev-attempt.json; then
              END=$(jq -r '.updated_at' meta/prev-attempt.json)
              ARTIFACTS=$(gh api --paginate "repos/$REPO/actions/runs/$PREV_RUN/artifacts" \
                --jq '.artifacts[] | {id, name, created_at, expired}' | jq -s '.')
              for NAME in verdict verdict-second verdict-report; do
                ID=$(jq -r --arg name "$NAME" --arg end "$END" \
                  'map(select(.name == $name and (.expired | not) and .created_at <= $end))
                   | sort_by(.created_at) | last | .id // empty' <<< "$ARTIFACTS")
                if [ -z "$ID" ]; then continue; fi
                gh api "repos/$REPO/actions/artifacts/$ID/zip" > "meta/prev-$NAME.zip" \
                  && mkdir -p "prev/art/$NAME" && unzip -q "meta/prev-$NAME.zip" -d "prev/art/$NAME"
              done
              if [ -d prev/art/verdict ]; then
                find prev/art/verdict -maxdepth 1 -type f -exec cp {} prev/raw/ \;
                if [ -f prev/art/verdict/.verifier/issue.md ]; then cp prev/art/verdict/.verifier/issue.md prev/raw/; fi
              fi
              if [ -d prev/art/verdict-second ]; then find prev/art/verdict-second -maxdepth 1 -type f -exec cp {} prev/raw/ \;; fi
              if [ -f prev/art/verdict-report/result.json ]; then cp prev/art/verdict-report/result.json prev/raw/; fi
              if [ -f prev/art/verdict-report/comment.md ]; then cp prev/art/verdict-report/comment.md prev/raw/verifier-comment.md; fi
              jq --arg repo "$REPO" '{run_id: .id, run_attempt, repository: $repo, conclusion}' \
                meta/prev-attempt.json > prev/raw/run.json
              gh api --paginate "repos/$REPO/actions/runs/$PREV_RUN/attempts/$PREV_ATTEMPT/jobs" \
                --jq '.jobs[] | {name, status, conclusion}' | jq -s '{jobs: .}' > prev/raw/jobs.json
              # Same base as the current round: the merge base with the PR base branch tip.
              BASE_TIP=$(cat meta/base-sha.txt)
              PREV_BASE=""
              if [[ "$BASE_TIP" =~ ^[0-9a-f]{40}$ && "$PREV_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
                PREV_BASE=$(gh api "repos/$REPO/compare/$BASE_TIP...$PREV_HEAD" --jq '.merge_base_commit.sha' || true)
              fi
              if [[ ! "$PREV_BASE" =~ ^[0-9a-f]{40}$ ]]; then PREV_BASE=""; fi
              jq -n --arg head "$PREV_HEAD" --arg base "$PREV_BASE" \
                '{head_sha: (if $head == "" then null else $head end), base_sha: (if $base == "" then null else $base end)}' \
                > prev/raw/pr.json
              # The trusted policy as that round saw it: each trusted config at its verifier commit.
              # The diff compares only configs pinned to the verifier commit in both rounds.
              PREV_VERIFIER=$(jq -r '.verifier_commit // empty' prev/raw/provenance.json 2>/dev/null || true)
              if [[ "$PREV_VERIFIER" =~ ^[0-9a-f]{40}$ ]]; then
                for CONFIG in $(jq -r '.trustedConfigs[]' "$INPUTS"); do
                  mkdir -p "prev/raw/trusted/$(dirname "$CONFIG")"
                  gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$CONFIG?ref=$PREV_VERIFIER" \
                    > "prev/raw/trusted/$CONFIG" || rm -f "prev/raw/trusted/$CONFIG"
                done
                : > raw/policy-diff.patch
                for CONFIG in $(jq -r '.trustedConfigs[]' "$INPUTS"); do
                  if [ -f "prev/raw/trusted/$CONFIG" ] && grep -qxF "$CONFIG" meta/pinned-configs.txt; then
                    diff -u --label "previous/$CONFIG" --label "current/$CONFIG" \
                      "prev/raw/trusted/$CONFIG" "raw/trusted/$CONFIG" >> raw/policy-diff.patch
                  else
                    echo "# not compared (a copy is missing): $CONFIG" >> raw/policy-diff.patch
                  fi
                done
              fi
              if node trusted/scripts/calibration-judge.js collect prev/raw --inputs "$INPUTS" \
                --out prev/pkg > meta/prev-collect.log; then
                cp prev/pkg/manifest.json raw/previous-manifest.json
                PREV_PKG=prev/pkg
              fi
              PREV_TRANSITIONS=prev/raw
            fi
            if [[ "$PREV_HEAD" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              if [ "$PREV_HEAD" = "$HEAD_SHA" ]; then
                : > raw/head-diff.patch
              elif ! gh api -H 'Accept: application/vnd.github.diff' \
                "repos/$REPO/compare/$PREV_HEAD...$HEAD_SHA" > raw/head-diff.patch; then
                rm -f raw/head-diff.patch
              fi
            fi
            CURRENT_ISSUE=raw/issue.md
            if [ ! -f "$CURRENT_ISSUE" ]; then CURRENT_ISSUE=raw/issue-current.md; fi
            if [ -f prev/raw/issue.md ] && [ -f "$CURRENT_ISSUE" ]; then
              diff -u --label previous/issue.md --label current/issue.md \
                prev/raw/issue.md "$CURRENT_ISSUE" > raw/issue-diff.patch
              if [ $? -gt 1 ]; then rm -f raw/issue-diff.patch; fi
            fi
          fi

          if [ -n "$PREV_PKG" ] && node trusted/scripts/calibration-judge.js collect raw \
            --inputs "$INPUTS" --out meta/current-pkg > meta/current-collect.log; then
            node trusted/scripts/calibration-judge.js compare --current meta/current-pkg \
              --previous "$PREV_PKG" --inputs "$INPUTS" --out raw/round-compare.json || rm -f raw/round-compare.json
          fi
          COMPARE_ARGS=()
          if [ -f raw/round-compare.json ]; then COMPARE_ARGS=(--compare raw/round-compare.json); fi
          if [ -n "$PREV_TRANSITIONS" ]; then
            node trusted/scripts/calibration-judge.js transitions --current raw \
              --previous "$PREV_TRANSITIONS" "${COMPARE_ARGS[@]}" --out raw/round-transitions.json \
              || rm -f raw/round-transitions.json
          fi
          for FILE in previous-round.json round-compare.json round-transitions.json; do
            if [ -f "raw/$FILE" ]; then cp "raw/$FILE" pkg/context/; fi
          done

      - name: Collect packages
        id: pkg
        if: steps.pr.outputs.skip == 'false'
        env:
          HISTORICAL_COMMENT: ${{ steps.raw.outputs.historical_comment }}
        run: |
          set -uo pipefail
          if node trusted/scripts/calibration-judge.js collect raw \
            --inputs trusted/.github/calibration/inputs.json --out pkg > meta/collect.log; then
            echo "collected=true" >> "$GITHUB_OUTPUT"
          else
            echo "collected=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Inputs could not be collected; the analysis will report a manifest error"
          fi
          if [ "$HISTORICAL_COMMENT" = "false" ] && [ -f pkg/manifest.json ]; then
            jq 'if .inputs.verifierComment then .inputs.verifierComment.historical = false else . end' pkg/manifest.json > meta/manifest.json
            mv meta/manifest.json pkg/manifest.json
          fi

      # Runs before any model step; a rejected model skips both stages and the analysis is
      # published as an error. The reason travels in a file, never through the shell.
      - name: Check judge model
        id: model
        if: steps.pr.outputs.skip == 'false'
        env:
          JUDGE_MODEL: ${{ vars.CALIBRATION_JUDGE_MODEL }}
          VERIFIER_MODEL_VAR: ${{ vars.VERIFIER_MODEL }}
          COLLECTED: ${{ steps.pkg.outputs.collected }}
        run: |
          set -uo pipefail
          mkdir -p pkg
          VERIFIER_MODEL=$(jq -r '.model // empty' raw/provenance.json 2>/dev/null || true)
          if [ -z "$VERIFIER_MODEL" ]; then VERIFIER_MODEL="$VERIFIER_MODEL_VAR"; fi
          if node trusted/scripts/calibration-judge.js check-model "$JUDGE_MODEL" \
            --verifier-model "$VERIFIER_MODEL" \
            --allowlist trusted/.github/calibration/allowed-models.json 2> pkg/model-error.txt; then
            rm -f pkg/model-error.txt
            ALLOWED="$COLLECTED"
          else
            ALLOWED=false
          fi
          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "- judge model allowed: $ALLOWED" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload independent package
        if: steps.pr.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: judge-independent
          include-hidden-files: true
          path: pkg/independent/
          if-no-files-found: ignore

      - name: Upload full package
        if: steps.pr.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: judge-full
          include-hidden-files: true
          path: |
            pkg/full/
            pkg/manifest.json
          if-no-files-found: ignore

      # Uploaded even after a failed step, so `publish` can report what is missing.
      - name: Upload round metadata
        if: always() && steps.pr.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: judge-meta
          path: |
            pkg/manifest.json
            pkg/model-error.txt
            pkg/context/
          if-no-files-found: ignore

  stage1:
    name: Stage 1
    needs: collect
    if: needs.collect.outputs.skip == 'false' && needs.collect.outputs.model_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      has_result: ${{ steps.result.outputs.has_result }}
    steps:
      - name: Checkout pull request head (data only)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.collect.outputs.head_sha }}
          persist-credentials: false

      - name: Checkout trusted Judge files from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            .github/calibration
            scripts/calibration-judge.js
            scripts/calibration-judge/
          persist-credentials: false

      # Anything the PR committed under these names is removed first, so the PR cannot supply
      # its own package, prompt, schema or result.
      - name: Clear Judge paths
        run: rm -rf calibration-input calibration-prompt.md calibration-schema.json stage1-result.json

      # Only the independent package: stage 1 must not see any verifier output (INV-4).
      - name: Download independent package
        uses: actions/download-artifact@v4
        with:
          name: judge-independent
          path: calibration-input

      - name: Build prompt and schema
        run: |
          set -euo pipefail
          node trusted/scripts/calibration-judge.js schema trusted/.github/calibration/independent.schema.json \
            --taxonomy trusted/.github/calibration/taxonomy.json --out calibration-schema.json
          {
            cat trusted/.github/calibration/prompt-stage1.md
            echo
            echo "The stage-1 input package directory is ./calibration-input/ in the repository checkout."
          } > calibration-prompt.md

      # Same pin and Codex CLI as the verifier; read the pin comment in acceptance-verifier.yml
      # (ADR-041, ISSUE-449 amendment) before changing it. A failed or timed-out model call fails
      # this job only; the steps below run with always(), and a missing result becomes an analysis
      # error in `publish`. The Judge workflow is never a required check.
      - name: Run Calibration Judge (stage 1)
        id: codex
        timeout-minutes: 10
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: calibration-prompt.md
          output-schema-file: calibration-schema.json
          output-file: stage1-result.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-version: ${{ env.CODEX_VERSION }}
          model: ${{ vars.CALIBRATION_JUDGE_MODEL }}
          effort: high

      - name: Record stage 1 result
        id: result
        if: always()
        run: |
          if [ -f stage1-result.json ]; then
            echo "has_result=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload stage 1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-stage1
          path: stage1-result.json
          if-no-files-found: ignore

  stage2:
    name: Stage 2
    needs: [collect, stage1]
    if: always() && needs.collect.outputs.skip == 'false' && needs.collect.outputs.model_allowed == 'true' && needs.stage1.outputs.has_result == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head (data only)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.collect.outputs.head_sha }}
          persist-credentials: false

      - name: Checkout trusted Judge files from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            .github/calibration
            scripts/calibration-judge.js
            scripts/calibration-judge/
          persist-credentials: false

      - name: Clear Judge paths
        run: rm -rf calibration-input stage1-download calibration-prompt.md calibration-schema.json stage2-analysis.json

      - name: Download full package
        uses: actions/download-artifact@v4
        with:
          name: judge-full
          path: calibration-input

      # The stage 1 result arrives only as an artifact and is read, never rewritten: stage 2
      # writes its own stage2-analysis.json.
      - name: Download stage 1 result
        uses: actions/download-artifact@v4
        with:
          name: judge-stage1
          path: stage1-download

      - name: Build prompt and schema
        run: |
          set -euo pipefail
          cp -R calibration-input/full/. calibration-input/
          rm -rf calibration-input/full
          cp stage1-download/stage1-result.json calibration-input/stage1-result.json
          rm -rf stage1-download
          node trusted/scripts/calibration-judge.js schema trusted/.github/calibration/analysis.schema.json \
            --taxonomy trusted/.github/calibration/taxonomy.json --out calibration-schema.json
          {
            cat trusted/.github/calibration/prompt-stage2.md
            echo
            echo "The stage-2 input package directory is ./calibration-input/ in the repository checkout;"
            echo "stage1-result.json and manifest.json are in that directory."
          } > calibration-prompt.md

      # Same pin and Codex CLI as the verifier; see the comment on stage 1.
      - name: Run Calibration Judge (stage 2)
        id: codex
        timeout-minutes: 10
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: calibration-prompt.md
          output-schema-file: calibration-schema.json
          output-file: stage2-analysis.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-version: ${{ env.CODEX_VERSION }}
          model: ${{ vars.CALIBRATION_JUDGE_MODEL }}
          effort: high

      - name: Upload stage 2 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-stage2
          path: stage2-analysis.json
          if-no-files-found: ignore

  # Builds and keeps this round's analysis outside the publication queue: even when a queued
  # publication is cancelled (see `publish`), the analysis JSON stays as an artifact.
  assemble:
    name: Assemble analysis
    needs: [collect, stage1, stage2]
    if: always() && needs.collect.outputs.skip == 'false' && needs.collect.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted Judge files from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            .github/calibration
            scripts/calibration-judge.js
            scripts/calibration-judge/
          persist-credentials: false

      # Any of these artifacts may be absent (an earlier job failed or was skipped); a missing
      # file is reported by `assemble` as an analysis error of its stage.
      - name: Download round results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          for NAME in judge-meta judge-stage1 judge-stage2; do
            if ! gh run download "$RUN_ID" --repo "$REPO" --name "$NAME" --dir .; then
              echo "- artifact $NAME: absent" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # A rejected model is published as an analysis error naming the reason; a missing stage
      # file becomes an analysis error of that stage (assemble), so every round gets a comment.
      - name: Assemble analysis
        env:
          MODEL_ALLOWED: ${{ needs.collect.outputs.model_allowed }}
        run: |
          set -euo pipefail
          ARGS=(--manifest manifest.json --stage1 stage1-result.json --stage2 stage2-analysis.json \
            --taxonomy trusted/.github/calibration/taxonomy.json --out calibration-analysis.json \
            --previous context/previous-round.json --compare context/round-compare.json \
            --transitions context/round-transitions.json)
          if [ "$MODEL_ALLOWED" != "true" ]; then
            REASON=$(cat model-error.txt 2>/dev/null || true)
            ARGS+=(--model-error "модель запрещена: ${REASON:-model was not checked}")
          fi
          node trusted/scripts/calibration-judge.js assemble "${ARGS[@]}"

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: calibration-analysis
          path: calibration-analysis.json
          retention-days: 90

  publish:
    name: Publish analysis
    needs: [collect, assemble]
    if: always() && needs.assemble.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One publication per PR runs at a time, so two rounds never overwrite each other's record
    # in the shared comment. GitHub keeps only one pending job per group: a newer round's
    # publication cancels an older one that is still pending (never a running one). The
    # cancelled round's analysis stays in the `calibration-analysis` artifact and can be
    # republished by a manual run; protection beyond this group is Phase 2 (#569).
    concurrency:
      group: calibration-judge-publish-${{ needs.collect.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted Judge files from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            .github/calibration
            scripts/calibration-judge.js
            scripts/calibration-judge/
          persist-credentials: false

      - name: Download analysis
        uses: actions/download-artifact@v4
        with:
          name: calibration-analysis

      # Only a comment written by github-actions[bot] with the Judge marker is updated; the
      # record of this round becomes a new revision and the other rounds are kept.
      - name: Publish comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.collect.outputs.pr_number }}
          RUN_ID: ${{ needs.collect.outputs.run_id }}
          RUN_ATTEMPT: ${{ needs.collect.outputs.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | {id, user: {login: .user.login}, body}' | jq -s '.' > judge-comments.json
          node trusted/scripts/calibration-judge.js publish calibration-analysis.json \
            --comments judge-comments.json --author 'github-actions[bot]' --repository "$REPO" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --out judge-comment.md --id-out judge-comment-id.txt
          COMMENT_ID=$(cat judge-comment-id.txt)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@judge-comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@judge-comment.md > /dev/null
          fi

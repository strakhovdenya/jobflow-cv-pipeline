name: CI

on:
  push:
    branches: [main, "task/*-base"]
  pull_request:
    branches: [main, "task/*-base"]

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npx tsc --noEmit

  web-lint:
    name: Lint (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npm run lint

  web-typecheck:
    name: Typecheck (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Test (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow_secret
          POSTGRES_DB: jobflow_cv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobflow:jobflow_secret@localhost:5432/jobflow_cv
      STORAGE_ROOT: /tmp/jobflow-storage
      KNOWLEDGE_SOURCES_ROOT: /tmp/jobflow-knowledge-sources
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:cov

      # Requires the Codecov GitHub App (https://github.com/apps/codecov) to be
      # installed on this repo for codecov/patch and codecov/project status
      # checks to appear on PRs. CODECOV_TOKEN alone only enables report upload.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/lcov.info
          fail_ci_if_error: false

  test-e2e:
    name: Test (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow_secret
          POSTGRES_DB: jobflow_cv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobflow:jobflow_secret@localhost:5432/jobflow_cv
      REDIS_URL: redis://localhost:6379
      STORAGE_ROOT: /tmp/jobflow-storage
      KNOWLEDGE_SOURCES_ROOT: /tmp/jobflow-knowledge-sources
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow_secret
          POSTGRES_DB: jobflow_cv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobflow:jobflow_secret@localhost:5432/jobflow_cv
      STORAGE_ROOT: /tmp/jobflow-storage
      KNOWLEDGE_SOURCES_ROOT: /tmp/jobflow-knowledge-sources
      API_KEY: ci-smoke-test-key
      PORT: "3000"
      # NODE_ENV is intentionally NOT set at job level.
      # NODE_ENV=production is passed only to the container via docker run below.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Build Docker image
        run: docker build -t jobflow-app .

      - name: Start container
        run: |
          # --network host gives the container access to localhost:5432 (postgres service).
          # This approach is specific to Linux (ubuntu-latest) runners; it does not work on macOS.
          docker run -d --name jobflow_app \
            --network host \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e STORAGE_ROOT="${STORAGE_ROOT}" \
            -e KNOWLEDGE_SOURCES_ROOT="${KNOWLEDGE_SOURCES_ROOT}" \
            -e API_KEY="${API_KEY}" \
            -e NODE_ENV=production \
            -e AI_PROVIDER=fake \
            -e PORT="${PORT}" \
            jobflow-app

      - name: Wait for /health (max 60s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:${PORT}/health; then
              echo ""
              echo "App is healthy"
              exit 0
            fi
            echo "Attempt $i/30, retrying in 2s..."
            sleep 2
          done
          echo "App did not become healthy within 60s"
          docker logs jobflow_app
          exit 1

      - name: Verify no pending Prisma migrations
        run: npx prisma migrate status

      - name: Teardown
        if: always()
        run: |
          docker stop jobflow_app || true
          docker rm jobflow_app || true

  web-test:
    name: Test (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npm run test:cov

  web-build:
    name: Build (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npm run build

  scripts-test:
    name: Test (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm run test:scripts
      - run: npm run test:ralph

  dependabot-gate:
    name: Dependabot Severity Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Audits the actual lockfiles being merged (npm's own advisory DB) instead
    # of GitHub's Dependabot Alerts API. The alerts API reflects the *default
    # branch's* last scan, updated asynchronously after a push/merge — a PR
    # whose entire purpose is fixing an open alert can never pass a check that
    # queries that API, since the alert only closes once the fix has already
    # landed on main. Auditing the PR's own lockfile is synchronous and always
    # reflects the code actually being merged.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm's legacy /v1/security/audits/quick endpoint is being retired through 2026 and is
      # unreliable in the meantime (400/503, inconsistently) — upgrading to the latest npm CLI
      # uses the current bulk-advisory endpoint instead. scripts/ci-npm-audit-retry.sh adds a
      # retry-with-backoff safety net for any remaining transient registry unavailability, without
      # retrying (and so masking) a genuine high/critical vulnerability finding (see ISSUE-349).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: apps/api — install
        working-directory: apps/api
        run: npm ci

      - name: apps/api — fail on high/critical vulnerabilities (production deps)
        working-directory: apps/api
        run: bash ../../scripts/ci-npm-audit-retry.sh

      - name: apps/web — install
        working-directory: apps/web
        run: npm ci

      - name: apps/web — fail on high/critical vulnerabilities (production deps)
        working-directory: apps/web
        run: bash ../../scripts/ci-npm-audit-retry.sh


  factory-separation:
    name: Factory separation
    # Cross-side change gate: a PR that changes both the spec side and the
    # verifier side needs the factory-cross-change label, set by a trusted
    # owner. Runs only on pull_request (needs a base to diff against). The
    # classifier, its helpers and owners.json come only from the default
    # branch (INV-4), same pattern as spec-approval.yml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # INV-4: the classifier, its helpers and owners.json come from the
      # default branch, never from the PR head — a PR cannot weaken its own
      # gate. fetch-depth: 0 above fetches every branch, so origin/<default>
      # is already available without a second checkout. A PR that introduces
      # or renames these trusted files (they do not exist on the default
      # branch yet) has nothing to enforce against — skip rather than fail,
      # the same bootstrap exemption already used elsewhere for a mechanism's
      # own introducing PR.
      - name: Read trusted files from the default branch
        id: trusted
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:scripts/factory-separation.js" 2>/dev/null; then
            echo "::notice::scripts/factory-separation.js is not yet on $DEFAULT_BRANCH — skipping (this PR introduces it)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          mkdir -p trusted/scripts trusted/.github/verifier
          git show "origin/$DEFAULT_BRANCH:scripts/factory-separation.js" > trusted/scripts/factory-separation.js
          git show "origin/$DEFAULT_BRANCH:scripts/affects-scope.js" > trusted/scripts/affects-scope.js
          git show "origin/$DEFAULT_BRANCH:scripts/label-authority.js" > trusted/scripts/label-authority.js
          git show "origin/$DEFAULT_BRANCH:.github/verifier/owners.json" > trusted/.github/verifier/owners.json
          git show "origin/$DEFAULT_BRANCH:.github/verifier/factory-separation.json" > trusted/.github/verifier/factory-separation.json

      - name: Collect changed files and label timeline
        id: collect
        if: steps.trusted.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git diff --name-status "$BASE_SHA"..."$HEAD_SHA" > files.txt
          if ! TIMELINE=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/timeline" \
            --jq '.[] | select(.event == "labeled" or .event == "unlabeled") | {event, label, actor}' \
            | jq -s '.'); then
            TIMELINE='[]'
          fi
          echo "$TIMELINE" > timeline.json

      - name: Check factory separation
        if: steps.trusted.outputs.skip != 'true'
        run: |
          node trusted/scripts/factory-separation.js \
            --files files.txt --timeline timeline.json \
            --owners trusted/.github/verifier/owners.json \
            --config trusted/.github/verifier/factory-separation.json

  codeql:
    # Keep the historical required-check context used by repository rules.
    name: Analyze (javascript-typescript)
    if: always() && github.event_name == 'pull_request'
    needs:
      - lint
      - typecheck
      - web-lint
      - web-typecheck
      - test
      - test-e2e
      - build
      - docker-build
      - web-test
      - web-build
      - scripts-test
      - dependabot-gate
      - factory-separation
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: ".github/workflows/codeql.yml:analyze"

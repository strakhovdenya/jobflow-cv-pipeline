name: Acceptance Verifier

# Independent check of a PR against its GitHub Issue (ADR-041).
# Runs after the `CI` workflow completes (workflow_run). PR CodeQL is the final
# dependency-gated job inside CI and runs with `always()`, so it is attempted after the ordinary
# CI jobs even when one of them fails. Acceptance Verifier then runs after CI completes regardless
# of conclusion, reports its own findings, and independently prevents PASS when CI/CodeQL failed. workflow_run always runs the
# workflow file, prompt, schema and verdict script from the DEFAULT branch, so a PR cannot
# weaken its own check. The PR head is checked out only as data (read-only sandbox, never
# executed). The result is published as a PR comment and as the commit status
# `Acceptance Verifier` on the PR head commit (workflow_run jobs are not attached to the PR).
# Advisory by default; set repo variable VERIFIER_ENFORCE=true to make that status fail on a
# non-PASS verdict, then require the status in branch protection. After adding the
# `manual-verified` label, re-run only the `Report` job (labels are read live; the model is
# not called again).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: acceptance-verifier-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify
    if: github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'task/ISSUE-') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      pr_number: ${{ steps.collect.outputs.pr_number }}
      stale: ${{ steps.collect.outputs.stale }}
    steps:
      - name: Checkout pull request head (data only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted verifier files from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            .github/verifier
            scripts/acceptance-verdict.js
          persist-credentials: false

      - name: Collect inputs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^task/ISSUE-([0-9]+)- ]]; then
            echo "::error::Branch name does not carry an issue number"
            exit 1
          fi
          ISSUE_NUMBER="${BASH_REMATCH[1]}"
          PR_NUMBER="$EVENT_PR_NUMBER"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
              --json number --jq '.[0].number // empty')
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No open pull request found for branch $BRANCH"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          CURRENT_HEAD=$(jq -r '.head.sha' <<< "$PR_JSON")
          BASE_SHA=$(jq -r '.base.sha' <<< "$PR_JSON")
          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "::notice::PR head moved to $CURRENT_HEAD; a newer CI run will trigger its own verification"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

          mkdir -p .verifier
          gh issue view "$ISSUE_NUMBER" --json title,body \
            --jq '"# " + .title + "\n\n" + .body' > .verifier/issue.md
          if ! grep -qiE '^#{1,6}[[:space:]]+Acceptance Criteria' .verifier/issue.md; then
            echo "::error::Issue #$ISSUE_NUMBER has no 'Acceptance Criteria' section; acceptance is impossible"
            exit 1
          fi
          git diff --name-status "$BASE_SHA"..."$HEAD_SHA" > .verifier/files.txt
          git diff "$BASE_SHA"..."$HEAD_SHA" > .verifier/diff.patch

          CHECKS=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | {name, status, conclusion}' | jq -s '.')
          STATUSES=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/status" \
            --jq '.statuses[] | {name: .context, state}' | jq -s '.')
          jq -n --arg ci "$CI_CONCLUSION" --arg head "$HEAD_SHA" --argjson checks "$CHECKS" \
            --argjson statuses "$STATUSES" \
            '{head_sha: $head, ci_workflow_conclusion: $ci, checks: $checks, statuses: $statuses}' \
            > .verifier/ci.json
          cp .verifier/ci.json ci.json

      # The Codex response stream has been seen to break mid-answer ("Reconnecting... 1/5") after which
      # the action hangs past its timeout. Each attempt is bounded and non-fatal; a second attempt with
      # lower reasoning effort runs when the first one failed, timed out or left an unusable verdict.
      # A verdict that is still missing/invalid after that is a FAIL (fail closed), never a hang.
      - name: Run verifier
        id: attempt1
        if: steps.collect.outputs.stale != 'true'
        continue-on-error: true
        timeout-minutes: 6
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: trusted/.github/verifier/prompt.md
          output-schema-file: trusted/.github/verifier/schema.json
          output-file: verdict.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-version: 0.156.1
          model: ${{ vars.VERIFIER_MODEL }}
          effort: high

      - name: Validate verdict (attempt 1)
        id: valid1
        if: steps.collect.outputs.stale != 'true'
        continue-on-error: true
        run: jq -e '.criteria | type == "array"' verdict.json > /dev/null

      - name: Reset verdict before retry
        id: reset
        if: steps.collect.outputs.stale != 'true' && (steps.attempt1.outcome != 'success' || steps.valid1.outcome != 'success')
        run: |
          [ -f verdict.json ] && mv verdict.json verdict-attempt1.json
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Run verifier (retry, lower effort)
        id: attempt2
        if: steps.reset.outputs.retry == 'true'
        continue-on-error: true
        timeout-minutes: 6
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: trusted/.github/verifier/prompt.md
          output-schema-file: trusted/.github/verifier/schema.json
          output-file: verdict.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-version: 0.156.1
          model: ${{ vars.VERIFIER_MODEL }}
          effort: medium

      - name: Verifier diagnostics
        if: always() && steps.collect.outputs.stale != 'true'
        env:
          ATTEMPT1: ${{ steps.attempt1.outcome }}
          VALID1: ${{ steps.valid1.outcome }}
          ATTEMPT2: ${{ steps.attempt2.outcome }}
        run: |
          {
            echo "### Verifier diagnostics"
            echo "- attempt 1 (effort high): ${ATTEMPT1:-skipped}, verdict valid: ${VALID1:-skipped}"
            echo "- attempt 2 (effort medium): ${ATTEMPT2:-not run}"
            for f in verdict.json verdict-attempt1.json; do
              [ -f "$f" ] && echo "- $f: $(wc -c < "$f") bytes" || echo "- $f: absent"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check references
        if: always() && steps.collect.outputs.stale != 'true' && hashFiles('verdict.json') != ''
        run: node trusted/scripts/acceptance-verdict.js --check-refs verdict.json --root . --out refs-problems.json

      - name: Upload verdict
        if: always() && steps.collect.outputs.stale != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: |
            verdict.json
            verdict-attempt1.json
            refs-problems.json
            ci.json
          if-no-files-found: ignore

  report:
    name: Report
    needs: verify
    if: always() && needs.verify.outputs.pr_number != '' && needs.verify.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted verdict script from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/acceptance-verdict.js
          persist-credentials: false

      - name: Download verdict
        uses: actions/download-artifact@v4
        with:
          name: verdict
        continue-on-error: true

      - name: Compute verdict and comment
        id: verdict
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.verify.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MANUAL_VERIFIED=false
          LABELS=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
          if grep -qx 'manual-verified' <<< "$LABELS"; then
            MANUAL_VERIFIED=true
          fi
          if [ "$VERIFY_RESULT" != "success" ]; then
            rm -f verdict.json refs-problems.json ci.json
          fi
          ARGS=(--ci ci.json)
          if [ "$MANUAL_VERIFIED" = "true" ]; then ARGS+=(--manual-verified); fi
          if [ -f refs-problems.json ]; then ARGS+=(--refs-problems refs-problems.json); fi
          RESULT=$(node scripts/acceptance-verdict.js verdict.json --out comment.md "${ARGS[@]}")
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Publish comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.verify.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COMMENT_ID=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- acceptance-verifier -->"))) | .id' \
            | sed -n 1p)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi

      - name: Set commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ steps.verdict.outputs.result }}
          VERIFIER_ENFORCE: ${{ vars.VERIFIER_ENFORCE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          STATE=success
          DESCRIPTION="Verdict: $RESULT"
          if [ "$RESULT" != "PASS" ]; then
            if [ "$VERIFIER_ENFORCE" = "true" ]; then
              STATE=failure
            else
              DESCRIPTION="Advisory, verdict: $RESULT"
            fi
          fi
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="Acceptance Verifier" \
            -f description="$DESCRIPTION" -f target_url="$RUN_URL" > /dev/null
